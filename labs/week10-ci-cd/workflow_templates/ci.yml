name: ci

on:
  pull_request:
    paths:
      - "labs/week10-ci-cd/**"
  push:
    paths:
      - "labs/week10-ci-cd/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week10-ci-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/week10-ci-cd/requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run the tests
        run: pytest -q
